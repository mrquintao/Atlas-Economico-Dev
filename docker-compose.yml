# Ambiente local completo: PostgreSQL + API + frontend.
#   docker compose up --build -d
#   docker compose exec api python -m app.ingestion.cli ingest --all
# Coleta automática (opcional): serviço `scheduler`, no horário de INGEST_SCHEDULE (Brasília).
#   docker compose --profile scheduler up --build -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    # PostgreSQL is reachable by the API on the Compose network. Only publish its
    # development port on loopback; never expose the database to the LAN/Internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@db:5432/${POSTGRES_DB:-atlas}
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Healthy once migrations ran and the API answers (the scheduler waits for it).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "app.ingestion.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@db:5432/${POSTGRES_DB:-atlas}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Times of day (HH:MM, comma-separated) in America/Sao_Paulo.
      INGEST_SCHEDULE: ${INGEST_SCHEDULE:-06:00}
      INGEST_ON_START: ${INGEST_ON_START:-false}
    depends_on:
      api:
        condition: service_healthy  # migrations are applied by the API on start-up
    restart: unless-stopped
    # Lets a collection in progress finish (each indicator is atomic) on `docker compose stop`.
    stop_grace_period: 2m

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Address used by the browser to reach the API.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
