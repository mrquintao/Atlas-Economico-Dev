name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job names below are the required checks of the merge gate (AGENT_POLICY §3) and are
# repeated in release.yml: rename them in both places.
jobs:
  api:
    name: API (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      # Fail instead of silently skipping the PostgreSQL integration tests.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Migrations (upgrade, downgrade, upgrade, models in sync)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable database with SYNTHETIC data only (services/api/tests/fixtures/e2e_seed.py);
      # the job never calls the official sources.
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Database (migrations and synthetic E2E fixture)
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          ATLAS_E2E_SEED=1 uv run python -m tests.fixtures.e2e_seed
      - name: Install web dependencies and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: E2E tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker Compose (build and smoke test)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose --profile scheduler build
      - name: Start stack (with the optional scheduler)
        # Schedule 12 h ahead, so the scheduler never collects real data during the job.
        run: |
          export INGEST_SCHEDULE="$(TZ=America/Sao_Paulo date -d '+12 hours' +%H:%M)"
          docker compose --profile scheduler up -d --wait --wait-timeout 180
      - name: Smoke test (no external data collection)
        shell: bash  # enables -o pipefail, so a failing curl fails the step
        run: |
          # The API applies migrations on start-up; retry until it answers.
          retry="--retry 30 --retry-delay 2 --retry-all-errors"
          curl -fsS $retry http://localhost:8000/api/v1/health
          curl -fsS $retry http://localhost:8000/api/v1/indicators/SELIC_TARGET | grep -q '"source_series_code":"432"'
          curl -fsS $retry http://localhost:3000 | grep -q "Brasil em Perspectiva"
          # Scheduler: valid configuration, time zone data, migrated database reachable, and
          # waiting for its next run.
          docker compose --profile scheduler exec -T scheduler python -m app.ingestion.scheduler --check
          for _ in $(seq 30); do
            docker compose --profile scheduler logs --no-color scheduler | grep -q scheduler_waiting && break
            sleep 2
          done
          docker compose --profile scheduler logs --no-color scheduler | grep -q scheduler_waiting
      - name: scripts/dev.sh docker (restart the stack through the dev script)
        shell: bash
        run: |
          docker compose --profile scheduler down
          scripts/dev.sh docker --no-data
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000 | grep -q "Brasil em Perspectiva"
      - name: Logs on failure
        if: failure()
        run: docker compose --profile scheduler logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --profile scheduler down -v

  dev-script:
    name: Dev script (shellcheck, local smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Local run without external data (start, check, stop)
        shell: bash
        run: |
          scripts/dev.sh --no-data > dev.log 2>&1 &
          pid=$!
          for _ in $(seq 150); do
            grep -q "em execução" dev.log && break
            kill -0 "$pid" 2>/dev/null || { cat dev.log; exit 1; }
            sleep 2
          done
          grep -q "em execução" dev.log || { cat dev.log; exit 1; }
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:3000 | grep -q "Brasil em Perspectiva"
          kill -TERM "$pid"
          wait "$pid" || true
          cat dev.log
          # Both servers (and their child processes) must be gone.
          ! curl -fsS -o /dev/null http://localhost:8000/api/v1/health
          ! curl -fsS -o /dev/null http://localhost:3000
