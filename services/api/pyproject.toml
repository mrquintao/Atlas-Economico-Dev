[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas Econômico Brasileiro — API e pipeline de ingestão de dados oficiais"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    # IANA time zones for zoneinfo (America/Sao_Paulo); slim images may lack system tzdata.
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Seed migrations hold long Portuguese texts that should not be reflowed by hand.
"migrations/versions/*" = ["E501"]
